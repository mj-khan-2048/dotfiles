# Prefix 
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# General 
set -g mouse on
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm*:RGB"
set -sg escape-time 10            
set -g focus-events on           
set -g history-limit 50000
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on      
set -g status-position top

# Keybindings 
setw -g mode-keys vi
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind _ split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Pane navigation (prefix + h/j/k/l)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (prefix + H/J/K/L, repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Plugins 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Theme
# Status bar
set -g status-interval 15
set -g status-style "fg=white,bg=default"

set -g status-left-length 40
set -g status-left "#[fg=black,bg=green,bold] #S #[default]"

set -g status-right-length 60
set -g status-right " %m-%d-%Y | %H:%M | #H "

# Window list
set -g window-status-style "fg=brightblack"
set -g window-status-separator ""
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-current-style "fg=black,bg=blue,bold"
set -g window-status-last-style "fg=blue"

# Panes
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"

# Command prompt and messages 
set -g message-style "fg=black,bg=blue"

# Keep this line at the very bottom
run '~/.tmux/plugins/tpm/tpm'
